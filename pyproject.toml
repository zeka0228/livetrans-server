[project]
name = "livetrans"
version = "0.1.0"
description = "실시간 방송 번역기 백엔드 — 지연 동기 자막·번역·TTS 파이프라인 서버"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "faster-whisper>=1.1",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "nvidia-cublas-cu12; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9; sys_platform == 'win32'",
    "nvidia-ml-py>=12",
    "comtypes>=1.4 ; sys_platform == 'win32'",
    "pyopenjtalk-plus>=0.4.1",
    "torch>=2.9,<2.10",
    "transformers>=4.55,<4.56",
    "pandas>=3.1.0",
    "pyannote-audio>=4.0,<5",
    "torchaudio>=2.9,<2.10",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["livetrans"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["ASYNC210", "ASYNC220", "ASYNC221"]  # 일회성 도구 스크립트: 블로킹 호출 허용
