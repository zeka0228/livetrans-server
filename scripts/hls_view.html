<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>livetrans 모드 A HLS 보기 (scripts/mode_a_browser_demo.py)</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font: 14px/1.4 system-ui, sans-serif; }
  #wrap { max-width: 1100px; margin: 0 auto; padding: 12px 16px; }
  video { width: 100%; background: #000; display: block; }
  #log { white-space: pre-wrap; font: 12px/1.3 Consolas, monospace; background: #1b1b1b; padding: 8px; height: 180px; overflow: auto; margin-top: 8px; }
  #stat { margin: 6px 0; }
  video::cue { font-size: 28px; background: rgba(0,0,0,.6); }
</style>
</head>
<body>
<div id="wrap">
  <div id="stat">src: <span id="src"></span></div>
  <video id="v" controls autoplay muted playsinline></video>
  <div id="log"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const src = q.get("src");
  const logEl = document.getElementById("log");
  const t0 = performance.now();
  function log(...a) {
    const line = `[${((performance.now() - t0) / 1000).toFixed(1)}s] ` + a.join(" ");
    console.log("[hlsview]", line);
    logEl.textContent += line + "\n";
    logEl.scrollTop = logEl.scrollHeight;
  }
  document.getElementById("src").textContent = src || "(없음: ?src=... 필요)";
  const video = document.getElementById("v");
  if (src && window.Hls && Hls.isSupported()) {
    const hls = new Hls({ liveSyncDurationCount: 3, enableWorker: true, debug: false });
    hls.on(Hls.Events.MANIFEST_PARSED, (e, d) => log("MANIFEST_PARSED levels=" + d.levels.length + " subtitles=" + (d.subtitleTracks || []).length));
    hls.on(Hls.Events.LEVEL_LOADED, (e, d) => log("LEVEL_LOADED live=" + d.details.live + " frags=" + d.details.fragments.length + " target=" + d.details.targetduration));
    hls.on(Hls.Events.FRAG_BUFFERED, (e, d) => { if (d.frag.sn % 5 === 0) log("FRAG_BUFFERED sn=" + d.frag.sn + " type=" + d.frag.type); });
    hls.on(Hls.Events.SUBTITLE_TRACKS_UPDATED, (e, d) => log("SUBTITLE_TRACKS " + d.subtitleTracks.map(t => t.name + "/" + t.lang).join(",")));
    hls.on(Hls.Events.ERROR, (e, d) => log("ERROR fatal=" + d.fatal + " type=" + d.type + " details=" + d.details + (d.response ? " code=" + d.response.code : "")));
    hls.loadSource(src);
    hls.attachMedia(video);
    hls.subtitleDisplay = true;
    video.addEventListener("playing", () => log("video playing " + video.videoWidth + "x" + video.videoHeight + " t=" + video.currentTime.toFixed(2)));
    video.addEventListener("waiting", () => log("video waiting"));
    setInterval(() => {
      if (!video.paused) {
        const tt = video.textTracks;
        let cues = 0; for (const t of tt) if (t.mode === "showing" && t.activeCues) cues += t.activeCues.length;
        log("tick t=" + video.currentTime.toFixed(1) + " buffered=" + (video.buffered.length ? (video.buffered.end(video.buffered.length - 1) - video.currentTime).toFixed(1) : "-") + " size=" + video.videoWidth + "x" + video.videoHeight + " activeCues=" + cues);
      }
    }, 3000);
  } else {
    log("hls.js 사용 불가 또는 src 없음");
  }
</script>
</body>
</html>
