# 기본 설정 (기술 명세서 §7). 개인 설정은 config/default.local.yaml 로 덮어쓴다 (gitignore).
# 구현된 섹션만 둔다. 미구현 섹션(mt·timeline·tts)은 해당 단계에서 추가.
server:
  host: "127.0.0.1"
  port: 8765
audio:
  sample_rate: 16000
vad:
  threshold: 0.5
  min_speech_ms: 250
  min_silence_ms: 600
  speech_pad_ms: 200
  max_utterance_s: 8.0
stt:
  engine: dicow               # dicow | faster_whisper | fake  (D-019: 화자 조건부 Whisper, 로드 실패 시 fallback)
  model: "BUT-FIT/DiCoW_v3_3" # dicow 가중치 (CC BY 4.0, THIRD_PARTY_NOTICES.md). 미리 받기: scripts/download_models.py
  fallback: faster_whisper    # 일본어 품질 문제 시 model 을 "kotoba-tech/kotoba-whisper-v2.0-faster" 로 바꿔 비교 (D-019)
  fallback_model: "large-v3"
  rescue: faster_whisper      # 환각(반복 루프) 판정 시 그 발화만 다시 인식할 구조 엔진. DiCoW 마스크 디코딩이 반복에 자주 빠져서(ERR-008). VRAM +3 GB. 끄려면 null
  rescue_model: large-v3
  device: "cuda"
  compute_type: "float16"
  beam_final: 5
  beam_partial: 1
  language: null              # null = 자동 감지, 또는 "ko" | "en" | "ja"
diar:
  mode: stream                # stream = 연속 오디오 + 120 s 창 + 화자 레인 (D-028, 자막이 화자가 말을 멈춘 뒤 약 3~6 s 에 확정) | utterance = 발화 단위 (D-027)
  window_s: 120               # stream 창 길이(초). 실방송 시뮬레이션: 120 s 98.2 % 일치, 60 s 이하 ~70 %
  hop_s: 3                    # stream 창 실행 간격(초). 창당 ≈ 0.6 s GPU → 점유 ≈ 20 %
  right_context_s: 2          # stream 확정을 미루는 오른쪽 문맥(초)
  engine: none                # none | pyannote  (D-021). 앱이 API 계약 S-17(speaker 필드)을 반영하기 전까지 기본 none.
                              # 켜려면 default.local.yaml 에 diar: {engine: pyannote}. 모델은 HF 이용 조건 동의 + 토큰 필요:
                              #   scripts/download_models.py --diar  (토큰은 hf auth login 또는 HF_TOKEN)
  model: "pyannote/speaker-diarization-community-1"   # CC BY 4.0, THIRD_PARTY_NOTICES.md
  device: "cuda"
  max_speakers: 4             # 세션당 화자 상한
  max_speakers_per_seg: 2     # 구간당 동시 화자 상한 k. 화자마다 STT 1회 → segment.final 이 화자별로 1개씩
  match_threshold: 0.6        # 기존 화자로 볼 코사인 하한 (LDA 공간). 합성음 측정 2026-10-23: 같은 화자 0.79, 다른 화자 0.14~0.56 — 실방송으로 재조정
  min_speaker_ms: 300         # 구간 안에서 이보다 짧게 말한 화자는 버림
  context_s: 20               # 직전 발화를 이만큼(초) 이어 붙여 함께 분할. 발화 하나(≤8 s)만 넣으면 순차 2화자를 한 화자로 합침 (측정)
tts:
  engines:                    # 엔진 인스턴스 (명세 §5.4). 개인 엔진은 default.local.yaml 에 추가
    system:    { type: system }      # Windows 기본 음성 (SAPI)
    openjtalk: { type: openjtalk }   # 일본어 기본 음성 (D-018)
  defaults:                   # 언어별 기본 음성 "<엔진>:<voice_id>", auto = 그 엔진에서 언어가 맞는 첫 음성
    ko-KR: "system:auto"
    en-US: "system:auto"
    ja-JP: "openjtalk:default"
  max_chars: 500
  cache_items: 128
mt:                           # 번역 (명세 §4.4). 자막은 번역이 실패해도 원문(passthrough)으로 나간다
  engine: ollama_llm          # Ollama 로컬 LLM (http://127.0.0.1:11434). Ollama 가 없으면 passthrough 로 자동 폴백
  model: gemma2:9b            # 2026-10-23 측정: 190~440 ms/문장, 서버와 함께 100 % GPU (6.3 GB). qwen2.5:7b 는 빠르지만 한국어 출력에 중국어가 섞임
  fallback: [passthrough]
  context_pairs: 3            # 화자별 직전 (원문, 번역) 쌍
  timeout_s: 6.0
  glossary: config/glossary.yaml   # 용어집 (+ glossary.local.yaml). 형식: {"ja->ko": {용어: 번역}, "*->ko": {...}}

logging:
  dir: "logs"                 # gitignore. 세션 기록 (명세 §11)
  per_session_jsonl: true     # 보낸 이벤트 전부 → logs/<날짜>_<세션>.jsonl (자막 오류 사례 수집)
  dump_audio: false           # true 면 확정 발화 PCM 을 logs/audio/<날짜>_<세션>/segNNNN.wav 로 저장 — 오프라인 엔진 비교·화자 분할 분석용.
                              #   개인 테스트 전용(방송 음성이 디스크에 남음), 분석이 끝나면 지울 것. default.local.yaml 에서 켠다.
